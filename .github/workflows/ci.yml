name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,otel]"
      # No Redis, GitHub or OpenAI needed: the suite uses fakes and a scripted LLM.
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pr-reviewer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Both services start and report healthy
        run: |
          docker network create ci
          docker run -d --name redis --network ci redis:7-alpine
          for service in gateway reviewer; do
            port=$([ "$service" = gateway ] && echo 8000 || echo 8001)
            docker run -d --name "$service" --network ci -p "$port:$port" \
              -e SERVICE="$service" -e PORT="$port" -e REDIS_URL=redis://redis:6379/0 \
              -e GITHUB_WEBHOOK_SECRET=ci -e GITHUB_APP_ID=1 -e GITHUB_PRIVATE_KEY=unused -e OPENAI_API_KEY=unused \
              pr-reviewer:ci
          done
          for port in 8000 8001; do
            curl --retry 15 --retry-delay 2 --retry-all-errors -sf "http://localhost:$port/health"
            curl -sf "http://localhost:$port/metrics" | grep -q prr_
          done
      - if: failure()
        run: docker logs gateway; docker logs reviewer

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
