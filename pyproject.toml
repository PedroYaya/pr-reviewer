[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-reviewer"
version = "0.3.0"
description = "AI pull request reviewer delivered as a GitHub App"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "redis>=5,<9",
    "requests>=2.32,<3",
    "PyJWT[crypto]>=2.9,<3",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "numpy>=1.26,<3",
    "tenacity>=9,<10",
    "prometheus-client>=0.20,<1",
    "opentelemetry-api>=1.27,<2",
]

[project.optional-dependencies]
# Exports traces over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT is set.
otel = [
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.27,<2",
]

[tool.setuptools.packages.find]
include = ["pr_reviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
